services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    volumes:
      - h2o_data:/shared
    environment:
      # Gemeinsames Secret mit "worker" (siehe dort) - nginx setzt es als
      # Header auf jeden /api/-Request, den es weiterleitet. AENDERN fuer den
      # echten Betrieb (z.B. per Coolify-Secret), dieser Wert ist nur ein
      # lokaler Default.
      INTERNAL_API_SECRET: change-me-in-coolify
    # Kein Host-Port-Binding: web soll ausschliesslich ueber Coolifys Proxy
    # erreichbar sein, nie direkt ueber einen am Host gebundenen Port.
    # "expose" macht den Port nur innerhalb des Compose-Netzwerks sichtbar
    # (fuer Coolifys Proxy), ohne ihn am Host zu binden.
    expose:
      - "80"
    depends_on:
      - worker
    healthcheck:
      # CMD-SHELL, damit die Ausgabe verworfen werden kann - prueft explizit
      # gegen 127.0.0.1:80, also wirklich den nginx-Prozess in diesem
      # Container (nicht nur "der Container existiert").
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    volumes:
      - h2o_data:/shared
    environment:
      TZ: Europe/Vienna
      H2O_DATA_DIR: /shared/data
      H2O_HISTORY_DIR: /shared/history
      # Muss mit web's INTERNAL_API_SECRET uebereinstimmen.
      INTERNAL_API_SECRET: change-me-in-coolify
    # Bewusst KEIN "ports:"/"expose:" - nur ueber das interne Compose-Netzwerk
    # erreichbar (nginx' proxy_pass in nginx.conf.template), nie direkt von
    # aussen und nie an Coolifys Proxy/Domain gehaengt.
    healthcheck:
      # Nicht nur "Prozess laeuft" - /healthz prueft zusaetzlich, dass der
      # letzte SCHEDULED wasserstand-Lauf (15-Min-Zyklus) innerhalb von 20
      # Minuten erfolgreich war (siehe worker/server.js).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz > /dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      # Grosszuegig, damit der allererste Cron-Tick nach dem Start (im
      # ungluecklichsten Fall fast 15 Minuten entfernt) nicht schon als
      # unhealthy gewertet wird.
      start_period: 20m
    restart: unless-stopped

# Expliziter Name (statt dem von Compose abgeleiteten "<projekt>_h2o_data"),
# damit IMMER dasselbe Docker-Volume wiederverwendet wird - auch wenn sich
# der Compose-Projektname/-Praefix durch ein Coolify-Redeploy oder eine
# Ressourcen-Umbenennung mal aendern sollte. Ohne das koennte ein Redeploy
# unbemerkt ein neues, leeres Volume anlegen statt das bestehende zu nutzen.
volumes:
  h2o_data:
    name: h2o_data
