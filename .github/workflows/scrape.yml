name: Scrape H2O

# Der Hetzner-Server hat einen eigenen Worker-Container (Dockerfile.worker),
# der dieselben Skripte per node-cron minutengenau ausfuehrt und direkt ins
# gemeinsame Docker-Volume schreibt - ohne Git. Der scheduled Trigger hier ist
# deshalb deaktiviert (bestaetigt stabil seit dem Umstieg); workflow_dispatch
# bleibt als manueller Notfall-Fallback erhalten.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-h2o
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Scraper ausfuehren
        run: npm run scrape

      - name: Statistik aggregieren
        run: npm run stats

      - name: Daten committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data public/history
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Scrape: Daten aktualisiert ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
