name: Scrape H2O

# UEBERGANGSWEISE: Der Hetzner-Server hat jetzt einen eigenen Worker-Container
# (Dockerfile.worker), der dieselben Skripte per echtem crond minutengenau
# ausfuehrt und direkt ins gemeinsame Docker-Volume schreibt - ohne Git.
# Dieser Workflow laeuft parallel weiter (committet wie bisher nach public/),
# bis der Worker auf dem Server bestaetigt zuverlaessig laeuft. Danach hier
# nur den "schedule:"-Block auskommentieren/entfernen (workflow_dispatch als
# manueller Fallback bleibt) - nicht vorher, sonst gibt es eine Luecke in der
# Datenerfassung.
on:
  schedule:
    # Laeuft jede volle Stunde, rund um die Uhr (auch nachts), damit die
    # History lueckenlos ist und "morgen" nie leer bleibt.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-h2o
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Scraper ausfuehren
        run: npm run scrape

      - name: Statistik aggregieren
        run: npm run stats

      - name: Daten committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data public/history
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Scrape: Daten aktualisiert ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
