server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Daten kommen aus dem gemeinsamen Volume (vom Worker-Container befuellt),
    # nicht aus dem Image - deshalb alias statt root-relativem Pfad.
    location /data/ {
        alias /shared/data/;
        add_header Cache-Control "no-cache";
    }

    location /history/ {
        alias /shared/history/;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
